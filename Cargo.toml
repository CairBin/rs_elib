[package]
name = "rs_elib"
version = "0.1.0"
edition = "2024"

[features]
default = []
embed_static = []

[lib]
name = "rs_elib"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
axum = { version = "0.7", features = ["multipart", "macros"] }
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = "1.1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["std"] }
jsonwebtoken = "9.3"
bcrypt = "0.15"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
tokio = { version = "1.0", features = ["net", "rt-multi-thread", "macros", "fs", "io-util"] }
tower-http = { version = "0.5", features = ["cors", "fs", "compression-gzip", "compression-deflate", "compression-br", "catch-panic", "set-header"] }
mime_guess = "2.0"
once_cell = "1.19"
http = "1.1"
zip = { version = "2.1", features = ["deflate"] }
regex = "1.10"
sha2 = "0.10"
futures = "0.3"
pulldown-cmark = "0.9"
clap = { version = "4.5", features = ["derive"] }

[[bin]]
name = "rs_elib"
path = "src/main.rs"